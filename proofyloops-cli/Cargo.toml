 [package]
name = "proofyloops"
 version = "0.1.0"
 edition = "2021"
publish = true

 description = "CLI wrapper for proofyloops-core (includes advanced orchestration commands)"
 license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/proofyloops"
homepage = "https://github.com/arclabs561/proofyloops"
readme = "README.md"

 [dependencies]
 proofyloops-core = { version = "0.1.0", path = "../proofyloops-core" }
proofyloops-lean-embed = { version = "0.1.0", path = "../proofyloops-lean-embed", optional = true }
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"
 tempfile = "3.10"
 tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros"] }
 similar = "2"
 schemars = { version = "1.2.0", features = ["derive"] }
smtkit = "0.1.0"
sha2 = "0.10"

 [features]
default = []
 lean-embed = ["proofyloops-core/lean-embed", "dep:proofyloops-lean-embed", "proofyloops-lean-embed/enabled"]
 lsp = ["proofyloops-core/lsp"]
 planner = ["proofyloops-core/planner"]
 axi-agent = ["proofyloops-core/axi-agent"]

 [[bin]]
 name = "proofyloops"
 path = "src/main.rs"
