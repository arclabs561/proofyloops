[package]
name = "proofyloops-mcp"
version = "0.1.0"
edition = "2021"
publish = false

description = "MCP server wrapper for proofyloops (stdio)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/proofyloops"
homepage = "https://github.com/arclabs561/proofyloops"
readme = "../README.md"

[[bin]]
name = "proofyloops-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smtkit = "0.1.0"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
proofyloops-core = { path = "../proofyloops-core" }
rmcp = { version = "1.5.1", features = ["macros", "server", "client", "transport-io", "transport-child-process", "schemars"] }
schemars = { version = "1", features = ["derive"] }
